name: CI (lint / test / package)

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Package .vsix (dry-run artifact)
        run: npm run package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: het-devtools-vsix-${{ matrix.os }}
          path: "*.vsix"
          if-no-files-found: error

  # Extension-host smoke against VS Code 1.95 (browser-less, headless download).
  # ubuntu runners have no display: run under xvfb like standard vscode CI.
  integration:
    name: extension-host smoke (VS Code 1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Extension host smoke (activation + cockpit)
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_VERSION: "1.95.0"

