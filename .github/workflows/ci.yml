name: CI (lint / test / package)

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Package .vsix (dry-run artifact)
        run: npm run package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: het-devtools-vsix-${{ matrix.os }}
          path: "*.vsix"
          if-no-files-found: error

  # P2 platform REAL run — macOS native + Linux extension host driving a REAL
  # conan build through the extension (fixture = COMMITTED assets/template with
  # coverage off so macOS needs no GNU lcov/gcov; the coverage lane stays on
  # Linux/WSL DoD + local verify). This is the gate being iterated in the fix
  # loop, so it only runs on: workflow_dispatch, or a push whose commit message
  # contains [platform-real] — ordinary pushes skip it (quota-friendly). Once
  # converged, drop the keyword clause to make it fully manual-only.
  platform-real:
    name: platform-real (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[platform-real]')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap conan into PATH (native lane runtime)
        run: |
          python3 -m venv /tmp/het-conan
          /tmp/het-conan/bin/pip install --quiet "conan>=2,<3"
          echo "/tmp/het-conan/bin" >> "$GITHUB_PATH"

      # conan 2 needs a default profile before the first `create`; fresh
      # runners have none (~/.conan2/profiles/default missing -> error). Detect
      # once so the native lane can build (gcc on Linux, apple-clang on macOS).
      - name: Conan default profile detect (fresh runners)
        run: conan profile detect --force

      - name: Ensure macOS build tools (cmake/ninja)
        if: runner.os == 'macOS'
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          command -v ninja >/dev/null 2>&1 || brew install ninja

      # Decision 3 (docs real on macOS): native docs build needs doxygen/
      # graphviz on PATH and sphinx inside the PATH python (the conan venv).
      - name: macOS docs toolchain (doxygen/graphviz + sphinx venv)
        if: runner.os == 'macOS'
        run: |
          command -v doxygen >/dev/null 2>&1 || brew install doxygen
          command -v dot >/dev/null 2>&1 || brew install graphviz
          /tmp/het-conan/bin/pip install --quiet 'sphinx>=8,<9' 'sphinx-intl' 'sphinx-rtd-theme>=2,<4' 'numpy>=1.26'
          /tmp/het-conan/bin/python -c 'import numpy, sphinx; print("venv docs ok:", numpy.__version__)'
          echo "PATH python -> $(command -v python || echo none) | python3 -> $(command -v python3 || echo none)"

      # @vscode/test-electron's own macOS download+unzip is unreliable on the
      # runners (spawn .../MacOS/Electron ENOENT); install VS Code via the brew
      # cask to /Applications. scripts/run-real.mjs LOCATES the main executable
      # inside the .app at runtime (name has varied across versions).
      - name: Install VS Code (macOS, brew cask)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if [ ! -d "/Applications/Visual Studio Code.app" ]; then
            brew install --cask visual-studio-code
          fi
          ls -la "/Applications/Visual Studio Code.app/Contents/MacOS/" || true

      - name: REAL extension-host build (VS Code 1.95; xvfb on headless Linux)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:real
          else
            npm run test:real
          fi
        env:
          VSCODE_VERSION: "1.95.0"


