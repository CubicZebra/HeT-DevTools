name: CI (lint / test / package)

"on":
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Package .vsix
        run: npm run package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: het-devtools-vsix
          path: "*.vsix"
          if-no-files-found: error
